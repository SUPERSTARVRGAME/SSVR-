<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SSVR Soccer</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
<style>
body{margin:0;font-family:Arial}
#hud{position:fixed;z-index:5;top:10px;left:50%;
transform:translateX(-50%);background:#123;color:white;
padding:12px;border-radius:12px;text-align:center}
#help{position:fixed;z-index:5;bottom:10px;left:10px;
background:#123;color:white;padding:10px;border-radius:10px;
font-size:12px;max-width:280px}
#start{position:fixed;z-index:10;inset:0;background:#10291e;
color:white;display:flex;align-items:center;justify-content:center}
#panel{text-align:center;padding:25px;max-width:380px}
button{font-size:20px;padding:14px;border:0;border-radius:10px;
background:#f5d54d;font-weight:bold}
</style>
</head>
<body>
<div id="hud">
  <div id="score">BLUE 0 — 0 RED</div>
  <div id="msg">Kick the ball into either goal!</div>
</div>
<div id="help">
VR: Left stick moves. Swing your feet to kick.<br>
Desktop: WASD move, mouse look, SPACE kick, R reset.
</div>
<div id="start">
  <div id="panel">
    <h1>⚽ SSVR SOCCER</h1>
    <p>Soccer for Meta Quest 3.</p>
    <button id="startButton">START GAME</button>
  </div>
</div>

<a-scene
  renderer="antialias:true;colorManagement:true"
  background="color:#8fd0ef"
  vr-mode-ui="enabled:true"
  webxr="optionalFeatures: local-floor, bounded-floor">

<a-entity light="type:ambient;intensity:.8"></a-entity>
<a-entity light="type:directional;intensity:1.2"
          position="-5 12 6"></a-entity>

<!-- SOCCER FIELD -->
<a-plane rotation="-90 0 0" width="24" height="40"
 position="0 0 0" material="color:#238246"></a-plane>
<a-entity id="stripes"></a-entity>

<!-- FIELD LINES -->
<a-box position="0 .015 -20" width="24" height=".025"
 depth=".12" material="color:white"></a-box>
<a-box position="0 .015 20" width="24" height=".025"
 depth=".12" material="color:white"></a-box>
<a-box position="-12 .015 0" width=".12" height=".025"
 depth="40" material="color:white"></a-box>
<a-box position="12 .015 0" width=".12" height=".025"
 depth="40" material="color:white"></a-box>
<a-box position="0 .015 0" width="24" height=".025"
 depth=".08" material="color:white"></a-box>
<a-torus position="0 .03 0" rotation="-90 0 0"
 radius="3.2" radius-tubular=".045"
 material="color:white"></a-torus>
<a-cylinder position="0 .04 0" radius=".09" height=".03"
 material="color:white"></a-cylinder>

<!-- PENALTY AREAS -->
<a-box position="0 .015 -15.5" width="10" height=".025"
 depth=".1" material="color:white"></a-box>
<a-box position="-5 .015 -17.7" width=".1" height=".025"
 depth="4.4" material="color:white"></a-box>
<a-box position="5 .015 -17.7" width=".1" height=".025"
 depth="4.4" material="color:white"></a-box>
<a-box position="0 .015 15.5" width="10" height=".025"
 depth=".1" material="color:white"></a-box>
<a-box position="-5 .015 17.7" width=".1" height=".025"
 depth="4.4" material="color:white"></a-box>
<a-box position="5 .015 17.7" width=".1" height=".025"
 depth="4.4" material="color:white"></a-box>

<!-- BLUE GOAL -->
<a-entity position="0 0 -20">
<a-box position="-3 1.2 0" width=".14" height="2.4"
 depth="1.5" material="color:#eaf8ff"></a-box>
<a-box position="3 1.2 0" width=".14" height="2.4"
 depth="1.5" material="color:#eaf8ff"></a-box>
<a-box position="0 2.4 0" width="6" height=".14"
 depth="1.5" material="color:#eaf8ff"></a-box>
<a-box position="0 .04 0" width="6" height=".08"
 depth="1.5" material="color:#388bea"></a-box>
</a-entity>

<!-- RED GOAL -->
<a-entity position="0 0 20">
<a-box position="-3 1.2 0" width=".14" height="2.4"
 depth="1.5" material="color:#fff0ed"></a-box>
<a-box position="3 1.2 0" width=".14" height="2.4"
 depth="1.5" material="color:#fff0ed"></a-box>
<a-box position="0 2.4 0" width="6" height=".14"
 depth="1.5" material="color:#fff0ed"></a-box>
<a-box position="0 .04 0" width="6" height=".08"
 depth="1.5" material="color:#e34f43"></a-box>
</a-entity>

<a-entity id="trees"></a-entity>

<!-- PLAYER -->
<a-entity id="rig" position="0 0 8">
  <a-entity id="head" camera look-controls
    wasd-controls="enabled:false"
    position="0 1.65 0"></a-entity>

  <!-- LEFT LEG: NO KNEE -->
  <a-entity id="lf" position="-.2 .25 -.5">
    <a-cylinder position="0 .18 0" radius=".055"
      height=".36" material="color:#245eeb"></a-cylinder>
    <a-box position="0 0 -.12" width=".18" height=".09"
      depth=".32" material="color:#eef5ff"></a-box>
  </a-entity>

  <!-- RIGHT LEG: NO KNEE -->
  <a-entity id="rf" position=".2 .25 -.5">
    <a-cylinder position="0 .18 0" radius=".055"
      height=".36" material="color:#e34d43"></a-cylinder>
    <a-box position="0 0 -.12" width=".18" height=".09"
      depth=".32" material="color:#fff0e9"></a-box>
  </a-entity>

  <!-- TRACKED QUEST CONTROLLERS -->
  <a-entity id="lc"
    hand-controls="hand:left"
    tracked-controls="hand:left"></a-entity>
  <a-entity id="rc"
    hand-controls="hand:right"
    tracked-controls="hand:right"></a-entity>
</a-entity>

<!-- SOCCER BALL -->
<a-entity id="ball" position="0 .22 0">
  <a-sphere radius=".22"
    material="color:#fafafa;roughness:.45"></a-sphere>
  <a-sphere radius=".075" position=".12 .08 .12"
    material="color:#18211d"></a-sphere>
  <a-sphere radius=".075" position="-.13 -.07 .1"
    material="color:#18211d"></a-sphere>
  <a-sphere radius=".075" position=".03 -.09 -.15"
    material="color:#18211d"></a-sphere>
</a-entity>
</a-scene>

<script>
(function(){
const $=id=>document.getElementById(id);
const scene=document.querySelector('a-scene');
const rig=$('rig'),head=$('head'),ball=$('ball');
const lf=$('lf'),rf=$('rf'),lc=$('lc'),rc=$('rc');

let blue=0,red=0,last=performance.now(),goalTime=0;
let keys={},space=false,previousHead=null,dt=.016;

const V=()=>new THREE.Vector3();
const bp=V(0,.22,0),bv=V();
const old={l:V(),r:V()},fv={l:V(),r:V()};
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function world(e){
 let p=V();
 e.object3D.getWorldPosition(p);
 return p;
}

function reset(){
 bp.set(0,.22,0);
 bv.set(0,0,0);
 ball.object3D.position.copy(bp);
}

function score(team){
 if(performance.now()-goalTime<1300)return;
 goalTime=performance.now();
 if(team==='blue')blue++;else red++;
 $('score').textContent=`BLUE ${blue} — ${red} RED`;
 $('msg').textContent=team.toUpperCase()+' SCORES!';
 reset();
 setTimeout(()=>{$('msg').textContent='Kick the ball into either goal!'},1500);
}

function bounds(){
 rig.object3D.position.x=clamp(rig.object3D.position.x,-10.8,10.8);
 rig.object3D.position.z=clamp(rig.object3D.position.z,-18.2,18.2);
}

function locomotion(){
 const c=lc.components['tracked-controls'];
 const g=c&&c.controller&&c.controller.gamepad;
 let x=0,y=0;
 if(g&&g.axes){
   x=g.axes[2]||0;y=g.axes[3]||0;
   if(Math.abs(x)+Math.abs(y)<.05){
     x=g.axes[0]||0;y=g.axes[1]||0;
   }
 }
 let forward=V();
 head.object3D.getWorldDirection(forward);
 forward.y=0;forward.normalize();
 let right=V().crossVectors(forward,V(0,1,0)).negate().normalize();
 let m=forward.multiplyScalar(-y).addScaledVector(right,x);
 if(m.length()>1)m.normalize();
 rig.object3D.position.addScaledVector(m,dt*4);
 bounds();
}

function updateFoot(el,controller,side,now){
 let target=V();
 if(scene.is('vr-mode')){
   controller.object3D.getWorldPosition(target);
   target.add(V(0,-.47,-.12));
   rig.object3D.worldToLocal(target);
 }else{
   target.set(side==='l'?-.2:.2,
      .25+Math.sin(now*.006+(side==='l'?0:Math.PI))*.035,
      -.5);
 }
 el.object3D.position.lerp(target,1-Math.exp(-dt*15));
 el.object3D.position.y=Math.max(.1,el.object3D.position.y);

 const p=world(el);
 fv[side].copy(p).sub(old[side]).multiplyScalar(1/Math.max(dt,.001));
 old[side].copy(p);

 if(p.distanceTo(bp)<.44&&fv[side].length()>1.5){
   let direction=fv[side].clone();
   let speed=direction.length();
   direction.normalize();
   direction.y=clamp(direction.y+.12,-.1,.55);
   bv.addScaledVector(direction,Math.min(13,2.5+speed*1.3));
   bv.y=Math.max(bv.y,Math.min(4.5,1+speed*.22));
   $('msg').textContent=speed>5?'POWER SHOT!':'KICK!';
 }
}

function headHit(){
 const h=world(head);
 if(previousHead&&h.distanceTo(bp)<.4){
   let v=h.clone().sub(previousHead).multiplyScalar(1/Math.max(dt,.001));
   let speed=v.length();
   if(speed>1.2){
     v.normalize();
     bv.addScaledVector(v,Math.min(9,speed*2));
     bv.y=Math.max(bv.y,2);
   }
 }
 previousHead=h;
}

function updateBall(){
 bv.y-=9.81*dt;
 bp.addScaledVector(bv,dt);

 if(bp.y<.22){
   bp.y=.22;
   if(bv.y<-.8)bv.y*=-.4;
   else bv.y=0;
   bv.x*=Math.exp(-1.1*dt);
   bv.z*=Math.exp(-1.1*dt);
 }
 bv.x*=Math.exp(-.07*dt);
 bv.z*=Math.exp(-.07*dt);

 if(bp.x< -11.78){bp.x=-11.78;bv.x=Math.abs(bv.x)*.6}
 if(bp.x> 11.78){bp.x=11.78;bv.x=-Math.abs(bv.x)*.6}

 if(bp.z< -20){
   if(Math.abs(bp.x)<3&&bp.y<2.4)score('red');
   else{bp.z=-20;bv.z=Math.abs(bv.z)*.5}
 }
 if(bp.z>20){
   if(Math.abs(bp.x)<3&&bp.y<2.4)score('blue');
   else{bp.z=20;bv.z=-Math.abs(bv.z)*.5}
 }

 if(bv.length()<.04)bv.set(0,0,0);
 ball.object3D.position.copy(bp);
 ball.object3D.rotation.x+=bv.z*dt*1.5;
 ball.object3D.rotation.z-=bv.x*dt*1.5;
}

window.addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.code==='Space')space=true;
 if(e.key.toLowerCase()==='r')reset();
});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

$('startButton').onclick=async()=>{
 $('start').style.display='none';
 try{
   if(scene.enterVR&&!scene.is('vr-mode'))await scene.enterVR();
 }catch(e){
   $('msg').textContent='Use the VR goggles button to enter VR.';
 }
};
scene.addEventListener('enter-vr',()=>{
 $('start').style.display='none';
 $('help').style.display='none';
});
scene.addEventListener('exit-vr',()=>{$('help').style.display='block'});

for(let i=0;i<20;i++){
 let e=document.createElement('a-plane');
 e.setAttribute('rotation','-90 0 0');
 e.setAttribute('position',`0 .006 ${-19+i*2}`);
 e.setAttribute('width','24');
 e.setAttribute('height','2');
 e.setAttribute('material',
   `color:${i%2?'#238246':'#278a49'};roughness:1`);
 $('stripes').appendChild(e);
}

for(let s of [-1,1]){
 for(let i=0;i<10;i++){
   let x=s*14.4,z=-18+i*4;
   let t=document.createElement('a-cylinder');
   t.setAttribute('position',`${x} 1 ${z}`);
   t.setAttribute('radius','.17');
   t.setAttribute('height','2');
   t.setAttribute('material','color:#76502c');
   $('trees').appendChild(t);
   let c=document.createElement('a-sphere');
   c.setAttribute('position',`${x} 2.3 ${z}`);
   c.setAttribute('scale','1.1 1.2 1.1');
   c.setAttribute('material','color:#2c8048');
   $('trees').appendChild(c);
 }
}

function loop(now){
 requestAnimationFrame(loop);
 dt=clamp((now-last)/1000,.001,.04);
 last=now;

 if(scene.is('vr-mode'))locomotion();
 else{
   let f=V();
   head.object3D.getWorldDirection(f);
   f.y=0;f.normalize();
   let r=V().crossVectors(f,V(0,1,0)).negate().normalize();
   let m=V();
   if(keys.w)m.add(f);
   if(keys.s)m.sub(f);
   if(keys.a)m.sub(r);
   if(keys.d)m.add(r);
   if(m.lengthSq())rig.object3D.position.addScaledVector(m.normalize(),dt*4);
   bounds();

   if(space){
     let d=V();
     head.object3D.getWorldDirection(d);
     d.y=.25;d.normalize();
     bv.addScaledVector(d,8);
     bv.y=Math.max(bv.y,2);
     space=false;
   }
 }

 updateFoot(lf,lc,'l',now);
 updateFoot(rf,rc,'r',now);
 headHit();
 updateBall();
}
requestAnimationFrame(loop);
})();
</script>
</body>
  </html>
