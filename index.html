<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SSVR - VR Soccer</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #instructions {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="instructions">
    <b>SSVR — VR Soccer</b><br>
    Put on your Quest headset and enter VR.
    Move with the thumbstick. Move your controllers
    to control your virtual legs and kick the ball.
  </div>

  <a-scene
    background="color: #87CEEB"
    renderer="antialias: true"
    vr-mode-ui="enabled: true">

    <a-assets>
      <a-mixin id="whiteLine"
        material="color: white; roughness: 0.8">
      </a-mixin>
    </a-assets>

    <!-- LIGHTING -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 1.1"
              position="-4 8 3"></a-entity>

    <!-- PLAYER RIG -->
    <a-entity id="playerRig"
              position="0 0 5"
              stick-move>

      <a-camera id="camera"
                position="0 1.65 0"
                look-controls="enabled: true">
      </a-camera>

      <!-- PLAYER MODEL -->
      <a-entity
        id="vrfsPlayer"
        gltf-model="url(vrfs_player_blender_prob.glb)"
        position="0 0 0"
        scale="1 1 1">
      </a-entity>

      <!-- LEFT CONTROLLER -->
      <a-entity id="leftController"
