
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SSVR - VR Soccer</title>

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #instructions {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 10px;
      right: 10px;
      padding: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="instructions">
    <b>SSVR — VR Soccer</b><br>
    Put on your Quest headset and enter VR.
    Move with the thumbstick. Move your controllers
    to control your virtual legs and kick the ball.
  </div>

  <a-scene
    background="color: #87CEEB"
    renderer="antialias: true"
    vr-mode-ui="enabled: true">

    <a-assets>
      <a-mixin id="whiteLine"
        material="color: white; roughness: 0.8">
      </a-mixin>
    </a-assets>

    <!-- LIGHTING -->
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 1.1"
              position="-4 8 3"></a-entity>

    <!-- PLAYER RIG -->
    <a-entity id="playerRig"
              position="0 0 5"
              stick-move>

      <a-camera id="camera"
                position="0 1.65 0"
                look-controls="enabled: true">
      </a-camera<a-entity id="vrfsPlayer" gltf-model="url(vrfs_player_blender_prob.glb)" position="0 -1.65 0" scale="1 1 1"></a-entity>>

      <!-- LEFT CONTROLLER -->
      <a-entity id="leftController"
                tracked-controls="hand: left">
      </a-entity>

      <!-- RIGHT CONTROLLER -->
      <a-entity id="rightController"
                tracked-controls="hand: right">
      </a-entity>

      <!-- LEFT VIRTUAL LEG AND FOOT -->
      <a-entity id="leftLeg"
                leg-follow="controller: #leftController;
                            side: left">
      </a-entity>

      <!-- RIGHT VIRTUAL LEG AND FOOT -->
      <a-entity id="rightLeg"
                leg-follow="controller: #rightController;
                            side: right">
      </a-entity>

    </a-entity>

    <!-- SOCCER FIELD -->
    <a-plane position="0 0 0"
             rotation="-90 0 0"
             width="14"
             height="24"
             color="#278B37"
             material="roughness: 1">
    </a-plane>

    <!-- FIELD BOUNDARIES -->
    <a-box position="0 0.015 -12"
           width="14" height="0.03" depth="0.08"
           color="white"></a-box>

    <a-box position="0 0.015 12"
           width="14" height="0.03" depth="0.08"
           color="white"></a-box>

    <a-box position="-7 0.015 0"
           width="0.08" height="0.03" depth="24"
           color="white"></a-box>

    <a-box position="7 0.015 0"
           width="0.08" height="0.03" depth="24"
           color="white"></a-box>

    <!-- CENTER LINE -->
    <a-box position="0 0.02 0"
           width="14" height="0.025" depth="0.06"
           color="white"></a-box>

    <!-- CENTER CIRCLE -->
    <a-torus position="0 0.025 0"
             rotation="-90 0 0"
             radius="2"
             radius-tubular="0.035"
             color="white">
    </a-torus>

    <!-- GOALS -->
    <a-entity position="0 0 -11.6">
      <a-box position="-2 1 0"
             width="0.12" height="2" depth="0.12"
             color="white"></a-box>
      <a-box position="2 1 0"
             width="0.12" height="2" depth="0.12"
             color="white"></a-box>
      <a-box position="0 2 0"
             width="4" height="0.12" depth="0.12"
             color="white"></a-box>
      <a-box position="0 1 -0.8"
             width="4" height="2" depth="0.04"
             color="#DDDDDD"
             material="wireframe: true">
      </a-box>
    </a-entity>

    <a-entity position="0 0 11.6" rotation="0 180 0">
      <a-box position="-2 1 0"
             width="0.12" height="2" depth="0.12"
             color="white"></a-box>
      <a-box position="2 1 0"
             width="0.12" height="2" depth="0.12"
             color="white"></a-box>
      <a-box position="0 2 0"
             width="4" height="0.12" depth="0.12"
             color="white"></a-box>
      <a-box position="0 1 -0.8"
             width="4" height="2" depth="0.04"
             color="#DDDDDD"
             material="wireframe: true">
      </a-box>
    </a-entity>

    <!-- SOCCER BALL -->
    <a-sphere id="ball"
              position="0 0.22 0"
              radius="0.22"
              color="white"
              material="roughness: 0.65"
              ball-physics>
      <a-sphere radius="0.222"
                scale="1 1 1"
                color="#222222"
                material="wireframe: true">
      </a-sphere>
    </a-sphere>

    <!-- GAME CODE -->
    <script>
      AFRAME.registerComponent("leg-follow", {
        schema: {
          controller: { type: "selector" },
          side: { type: "string", default: "left" }
        },

        init: function () {
          this.previous = new THREE.Vector3();
          this.current = new THREE.Vector3();
          this.velocity = new THREE.Vector3();
          this.ready = false;

          const side = this.data.side;
          const color = side === "left" ? "#246BFD" : "#F04444";

          // Leg segment: no knee joint.
          const leg = document.createElement("a-cylinder");
          leg.setAttribute("radius", "0.075");
          leg.setAttribute("height", "0.7");
          leg.setAttribute("color", color);
          leg.setAttribute("position", "0 0.35 0");
          leg.setAttribute("material", "roughness: 0.8");
          this.el.appendChild(leg);

          // Foot: the only part intended to kick the ball.
          const foot = document.createElement("a-box");
          foot.setAttribute("width", "0.2");
          foot.setAttribute("height", "0.12");
          foot.setAttribute("depth", "0.34");
          foot.setAttribute("color", "#202020");
          foot.setAttribute("position", "0 0 0.08");
          foot.setAttribute("material", "roughness: 0.6");
          this.el.appendChild(foot);

          this.foot = foot;

          // Trigger can also kick when the foot is near the ball.
          if (this.data.controller) {
            this.data.controller.addEventListener(
              "triggerdown",
              () => this.kickBall(1)
            );
          }
        },

        tick: function (time, delta) {
          const controller = this.data.controller;

          if (!controller || !controller.object3D) return;

          if (!controller.object3D.visible) return;

          controller.object3D.getWorldPosition(this.current);

          // The controller is at the top of the virtual leg.
          // The leg and foot extend down from that position.
          const target = this.current.clone();
          target.y -= 0.75;

          const parent = this.el.parentEl;
          if (parent && parent.object3D) {
            parent.object3D.worldToLocal(target);
          }

          this.el.object3D.position.copy(target);

          if (delta > 0 && delta < 100) {
            if (this.ready) {
              const worldNow = this.current.clone();
              this.velocity.subVectors(
                worldNow, this.previous
              ).multiplyScalar(1000 / delta);
            }

            this.previous.copy(this.current);
            this.ready = true;
          }

          // Automatic contact kicking, based on foot movement.
          const ball = document.querySelector("#ball");
          if (!ball || !this.ready) return;

          const footWorld = new THREE.Vector3();
          this.foot.object3D.getWorldPosition(footWorld);

          const ballWorld = new THREE.Vector3();
          ball.object3D.getWorldPosition(ballWorld);

          const distance = footWorld.distanceTo(ballWorld);

          if (distance < 0.36 && this.velocity.length() > 0.8) {
            this.kickBall(Math.min(this.velocity.length(), 8));
          }
        },

        kickBall: function (power) {
          const ball = document.querySelector("#ball");
          if (!ball) return;

          const footWorld = new THREE.Vector3();
          this.foot.object3D.getWorldPosition(footWorld);

          const ballWorld = new THREE.Vector3();
          ball.object3D.getWorldPosition(ballWorld);

          if (footWorld.distanceTo(ballWorld) > 0.65) return;

          const direction = new THREE.Vector3()
            .subVectors(ballWorld, footWorld);

          direction.y = Math.max(0.12, direction.y);

          if (direction.lengthSq() < 0.001) {
            direction.set(0, 0.2, -1);
          }

          direction.normalize();

          ball.components["ball-physics"].kick(
            direction,
            3 + power * 0.65
          );
        }
      });

      // Thumbstick movement independent of virtual legs.
      AFRAME.registerComponent("stick-move", {
        schema: {
          speed: { type: "number", default: 3 }
        },

        init: function () {
          this.direction = new THREE.Vector3();
          this.forward = new THREE.Vector3();
          this.right = new THREE.Vector3();
          this.deadZone = 0.18;
        },

        tick: function (time, delta) {
          if (!this.el.sceneEl.is("vr-mode")) return;

          const scene = this.el.sceneEl;
          const session = scene.renderer.xr.getSession();

          if (!session) return;

          let x = 0;
          let y = 0;

          for (const source of session.inputSources) {
            if (!source.gamepad) continue;

            const axes = source.gamepad.axes;
            if (!axes || axes.length < 2) continue;

            // Prefer the left-hand thumbstick for locomotion.
            if (source.handedness === "left") {
              x = axes[2] !== undefined ? axes[2] : axes[0];
              y = axes[3] !== undefined ? axes[3] : axes[1];
              break;
            }
          }

          if (Math.abs(x) < this.deadZone) x = 0;
          if (Math.abs(y) < this.deadZone) y = 0;

          const camera = document.querySelector("#camera");
          if (!camera) return;

          camera.object3D.getWorldDirection(this.forward);
          this.forward.y = 0;
          this.forward.normalize();

          this.right.crossVectors(
            this.forward,
            new THREE.Vector3(0, 1, 0)
          ).normalize();

          this.direction.set(0, 0, 0);
          this.direction.addScaledVector(this.forward, -y);
          this.direction.addScaledVector(this.right, x);

          if (this.direction.lengthSq() > 1) {
            this.direction.normalize();
          }

          const seconds = Math.min(delta, 50) / 1000;
          const movement = this.direction.multiplyScalar(
            this.data.speed * seconds
          );

          this.el.object3D.position.x += movement.x;
          this.el.object3D.position.z += movement.z;

          // Keep the player inside the field.
          this.el.object3D.position.x = THREE.MathUtils.clamp(
            this.el.object3D.position.x, -6.5, 6.5
          );

          this.el.object3D.position.z = THREE.MathUtils.clamp(
            this.el.object3D.position.z, -11, 11
          );
        }
      });

      // Simple ball movement and ground bounce.
      AFRAME.registerComponent("ball-physics", {
        init: function () {
          this.velocity = new THREE.Vector3();
          this.lastKick = 0;
        },

        kick: function (direction, power) {
          const now = performance.now();

          if (now - this.lastKick < 180) return;
          this.lastKick = now;

          this.velocity.addScaledVector(direction, power);
          this.velocity.y = Math.max(
            this.velocity.y, power * 0.22
          );
        },

        tick: function (time, delta) {
          const dt = Math.min(delta, 40) / 1000;
          const pos = this.el.object3D.position;

          pos.addScaledVector(this.velocity, dt);

          this.velocity.y -= 9.8 * dt;

          if (pos.y < 0.22) {
            pos.y = 0.22;
            if (this.velocity.y < 0) {
              this.velocity.y *= -0.38;
            }
          }

          // Rolling friction.
          this.velocity.x *= Math.pow(0.985, dt * 60);
          this.velocity.z *= Math.pow(0.985, dt * 60);

          if (Math.abs(this.velocity.y) < 0.08 && pos.y <= 0.23) {
            this.velocity.y = 0;
          }

          if (this.velocity.length() < 0.025) {
            this.velocity.set(0, 0, 0);
          }

          // Keep the ball in the playing area.
          pos.x = THREE.MathUtils.clamp(pos.x, -6.7, 6.7);
          pos.z = THREE.MathUtils.clamp(pos.z, -11.7, 11.7);
        }
      });
    </script>
  </a-scene>
</body>
</html>
