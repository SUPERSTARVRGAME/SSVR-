
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSVR - VR Soccer</title>
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #help {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      color: white; background: #102b22dd; padding: 10px;
      border-radius: 8px; max-width: 270px;
    }
  </style>
</head>
<body>
<div id="help">
  <b>SSVR — Soccer</b><br>
  Put each controller near the top of its leg.<br>
  Swing a foot into the ball to kick it.<br>
  Use the left thumbstick to move.
</div>

<a-scene
  id="scene"
  background="color: #87ceeb"
  renderer="antialias: true"
  vr-mode-ui="enabled: true">

  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: directional; intensity: 1"
            position="-3 8 4"></a-entity>

  <!-- Soccer pitch -->
  <a-plane rotation="-90 0 0" width="18" height="30"
           color="#278b43"></a-plane>

  <a-box position="0 0.015 0" width="0.06" height="0.025"
         depth="26" color="white"></a-box>
  <a-ring position="0 0.03 0" rotation="-90 0 0"
          radius-inner="2.5" radius-outer="2.56"
          color="white"></a-ring>

  <!-- Goal at the far end -->
  <a-entity position="0 0 -13">
    <a-box position="-2 1 0" width="0.12" height="2"
           depth="0.12" color="white"></a-box>
    <a-box position="2 1 0" width="0.12" height="2"
           depth="0.12" color="white"></a-box>
    <a-box position="0 2 0" width="4.1" height="0.12"
           depth="0.12" color="white"></a-box>
    <a-box position="0 1 -0.4" width="4" height="1.9"
           depth="0.04" color="#dddddd"
           material="wireframe: true"></a-box>
  </a-entity>

  <!-- Player and VR camera -->
  <a-entity id="rig" position="0 0 5">
    <a-camera id="camera" position="0 1.6 0"
              wasd-controls-enabled="false"
              look-controls="pointerLockEnabled: false">
    </a-camera>

    <a-entity id="leftController"
              hand-controls="hand: left; handModelStyle: lowPoly">
    </a-entity>

    <a-entity id="rightController"
              hand-controls="hand: right; handModelStyle: lowPoly">
    </a-entity>
  </a-entity>

  <!-- Legs: no knees or leg collision -->
  <a-entity id="leftLeg">
    <a-cylinder position="0 -0.27 0"
                radius="0.105" height="0.55"
                color="#254bba"></a-cylinder>
    <a-box id="leftFoot" position="0 -0.55 -0.13"
           width="0.22" height="0.12" depth="0.38"
           color="#eeeeee"></a-box>
  </a-entity>

  <a-entity id="rightLeg">
    <a-cylinder position="0 -0.27 0"
                radius="0.105" height="0.55"
                color="#254bba"></a-cylinder>
    <a-box id="rightFoot" position="0 -0.55 -0.13"
           width="0.22" height="0.12" depth="0.38"
           color="#eeeeee"></a-box>
  </a-entity>

  <!-- Soccer ball -->
  <a-sphere id="soccerBall" position="0 0.22 0"
            radius="0.22" color="white"
            segments-width="24" segments-height="16">
  </a-sphere>

  <a-entity id="game"
    ssvr-game="rig: #rig; camera: #camera;
    left: #leftController; right: #rightController;
    leftLeg: #leftLeg; rightLeg: #rightLeg;
    ball: #soccerBall">
  </a-entity>
</a-scene>

<script>
AFRAME.registerComponent("ssvr-game", {
  schema: {
    rig: {type: "selector"},
    camera: {type: "selector"},
    left: {type: "selector"},
    right: {type: "selector"},
    leftLeg: {type: "selector"},
    rightLeg: {type: "selector"},
    ball: {type: "selector"}
  },

  init: function () {
    this.previousFeet = {
      left: new THREE.Vector3(),
      right: new THREE.Vector3()
    };
    this.footReady = {left: false, right: false};
    this.ballVelocity = new THREE.Vector3();
    this.ballPosition = new THREE.Vector3(0, 0.22, 0);
    this.temp = new THREE.Vector3();
    this.forward = new THREE.Vector3();
    this.rightward = new THREE.Vector3();
    this.up = new THREE.Vector3(0, 1, 0);
    this.kickCooldown = {left: 0, right: 0};
    this.lastTime = 0;
  },

  tick: function (time, delta) {
    if (!this.data.rig || !this.data.camera) return;

    const dt = Math.min(delta / 1000, 0.04);
    if (dt <= 0) return;

    const d = this.data;
    const scene = this.el.sceneEl;
    const session = scene.renderer && scene.renderer.xr
      ? scene.renderer.xr.getSession() : null;

    // Move using the left thumbstick, independently of the legs.
    if (session) {
      for (const source of session.inputSources) {
        if (!source.gamepad || source.handedness !== "left") continue;

        const axes = source.gamepad.axes;
        if (!axes || axes.length < 2) continue;

        const x = Math.abs(axes[2] || 0) > 0.01
          ? axes[2] : (axes[0] || 0);
        const y = Math.abs(axes[3] || 0) > 0.01
          ? axes[3] : (axes[1] || 0);

        const cameraWorld = new THREE.Vector3();
        d.camera.object3D.getWorldDirection(cameraWorld);
        cameraWorld.y = 0;

        if (cameraWorld.lengthSq() > 0) {
          cameraWorld.normalize();
          this.rightward.crossVectors(cameraWorld, this.up).normalize();

          const move = new THREE.Vector3()
            .addScaledVector(cameraWorld, -y)
            .addScaledVector(this.rightward, x);

          if (move.lengthSq() > 1) move.normalize();

          // Standard speed: 3 metres per second.
          d.rig.object3D.position.addScaledVector(move, 3 * dt);
        }
      }
    }

    this.updateLeg("left", d.left, d.leftLeg, dt);
    this.updateLeg("right", d.right, d.rightLeg, dt);

    // Simple ball physics: gravity, rolling friction and ground bounce.
    this.ballPosition.addScaledVector(this.ballVelocity, dt);
    this.ballVelocity.y -= 9.8 * dt;

    if (this.ballPosition.y < 0.22) {
      this.ballPosition.y = 0.22;
      if (this.ballVelocity.y < -1) {
        this.ballVelocity.y *= -0.35;
      } else {
        this.ballVelocity.y = 0;
      }
      this.ballVelocity.x *= Math.pow(0.985, dt * 60);
      this.ballVelocity.z *= Math.pow(0.985, dt * 60);
    }

    // Keep the ball inside the pitch.
    this.ballPosition.x = THREE.MathUtils.clamp(
      this.ballPosition.x, -8.7, 8.7
    );
    this.ballPosition.z = THREE.MathUtils.clamp(
      this.ballPosition.z, -14.5, 14.5
    );

    d.ball.object3D.position.copy(this.ballPosition);
    d.ball.object3D.rotation.x += this.ballVelocity.z * dt * 2;
    d.ball.object3D.rotation.z -= this.ballVelocity.x * dt * 2;
  },

  updateLeg: function (side, controller, leg, dt) {
    if (!controller || !leg) return;

    const controllerObject = controller.object3D;

    // Only follow a controller once WebXR has given it a valid pose.
    if (!controllerObject.visible) return;

    const position = new THREE.Vector3();
    const rotation = new THREE.Quaternion();
    controllerObject.getWorldPosition(position);
    controllerObject.getWorldQuaternion(rotation);

    // Controller sits near the top of the leg.
    leg.object3D.position.copy(position);
    leg.object3D.quaternion.copy(rotation);

    // Work out the actual foot position and its movement speed.
    const footOffset = new THREE.Vector3(0, -0.55, -0.13)
      .applyQuaternion(rotation);
    const footPosition = position.clone().add(footOffset);

    if (!this.footReady[side]) {
      this.previousFeet[side].copy(footPosition);
      this.footReady[side] = true;
      return;
    }

    const footVelocity = footPosition.clone()
      .sub(this.previousFeet[side])
      .divideScalar(dt);
    this.previousFeet[side].copy(footPosition);

    this.kickCooldown[side] = Math.max(
      0, this.kickCooldown[side] - dt
    );

    const ballDistance = footPosition.distanceTo(this.ballPosition);
    const speed = footVelocity.length();

    // A moving foot close to the ball produces a kick.
    if (ballDistance < 0.38 &&
        speed > 1.0 &&
        this.kickCooldown[side] <= 0) {

      const direction = footVelocity.normalize();
      const power = Math.min(speed * 1.8, 13);

      this.ballVelocity.x += direction.x * power;
      this.ballVelocity.y += Math.max(
        0.7, direction.y * power + 0.8
      );
      this.ballVelocity.z += direction.z * power;

      this.kickCooldown[side] = 0.18;
    }
  }
});
</script>
</body>
</html>
